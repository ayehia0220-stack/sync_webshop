server { listen 80; server_name shop.dpono.com; return 301 https://$host$request_uri; }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shop.dpono.com;

    ssl_certificate     /etc/letsencrypt/live/shop.dpono.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.dpono.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /home/webshop/wepdpono/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # dpono.com هو العنوان الرسمي دلوقتي. الدومين ده لسه شغال عشان أي لينك
    # اتبعت قبل كده ميكسرش، بس بيقول لجوجل إن الأصل هناك — عشان ميحسبهمش
    # موقعين بنفس المحتوى.
    add_header Link '<https://dpono.com$request_uri>; rel="canonical"' always;

    # ملفات مبنية بأسماء فيها بصمة — تخزين طويل آمن
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # خريطة الموقع و robots مبنيّان من الكتالوج الحيّ في ERPNext، فأي منتج جديد
    # يبقى قابلًا للفهرسة من غير ما حد يفتكر يحدّث ملف.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/api/method/sync_webshop.api.seo.sitemap;
        proxy_set_header Host erp1.dpono.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Set-Cookie;
        add_header Content-Type "application/xml; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000/api/method/sync_webshop.api.seo.robots;
        proxy_set_header Host erp1.dpono.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Set-Cookie;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    # الصفحة نفسها لا تُخزَّن — عشان أي نشر جديد يوصل فورًا.
    # ترويسات الأمان مكرّرة هنا عمدًا: أي add_header داخل location
    # يلغي الموروث من مستوى الـ server في nginx.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # تطبيق صفحة واحدة — أي مسار يرجّع index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
