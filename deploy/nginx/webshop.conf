# shop.dpono.com — اتقفل، الموقع بقى على dpono.com
#
# مش محذوف عشان أي لينك قديم اتبعت يفضل يشتغل. كل حاجة بتروح نفس
# المسار على الدومين الأساسي، فاللي فتح /products يلاقي /products.
# الرجوع: cp /root/webshop.conf.bak-* /etc/nginx/sites-enabled/webshop.conf

server {
    listen 80;
    listen [::]:80;
    server_name shop.dpono.com;
    return 301 https://dpono.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shop.dpono.com;

    ssl_certificate     /etc/letsencrypt/live/shop.dpono.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.dpono.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://dpono.com$request_uri;
}
