# dpono.com — المتجر الجديد
#
# كان هنا ووردبريس. الحاويةلسه شغالة على 127.0.0.1:8085 من غير ما تكون
# مفتوحة للناس، عشان لو احتجنا نرجع لأي بيانات. الرجوع للقديم:
#   cp /root/dpono.conf.bak-* /etc/nginx/sites-enabled/dpono.conf && nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name dpono.com www.dpono.com;
    return 301 https://dpono.com$request_uri;
}

# www ← apex. عنوان واحد للموقع عشان جوجل ميحسبهوش موقعين.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.dpono.com;

    ssl_certificate     /etc/letsencrypt/live/dpono.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dpono.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://dpono.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dpono.com;

    ssl_certificate     /etc/letsencrypt/live/dpono.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dpono.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /home/webshop/wepdpono/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # الـ ERP بس هو اللي مسموح يعرض الموقع جوه إطار (زرار المعاينة).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://erp1.dpono.com" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # مسارات ووردبريس القديمة. مفيش ووردبريس تاني، فالزائر يروح للمقابل
    # الجديد بدل ما ياخد صفحة خطأ.
    location /wp-admin  { return 301 https://erp1.dpono.com/app; }
    location /wp-login.php { return 301 https://erp1.dpono.com/login; }
    location /wp-json   { return 404; }
    location = /xmlrpc.php { deny all; access_log off; return 444; }
    location = /shop     { return 301 https://dpono.com/products; }
    location = /my-account { return 301 https://dpono.com/dashboard; }

    # صور المقالات والمنتجات القديمة — اتنقلت جوه ERPNext، فالروابط
    # القديمة تفضل شغالة بدل ما تبقى صور مكسورة في نتائج البحث.
    location /wp-content/uploads {
        return 301 https://erp1.dpono.com/files/;
    }

    # ملفات مبنية بأسماء فيها بصمة — تخزين طويل آمن
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/api/method/sync_webshop.api.seo.sitemap;
        proxy_set_header Host erp1.dpono.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Set-Cookie;
        add_header Content-Type "application/xml; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000/api/method/sync_webshop.api.seo.robots;
        proxy_set_header Host erp1.dpono.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Set-Cookie;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    # الصفحة نفسها لا تُخزَّن — عشان أي نشر جديد يوصل فورًا.
    # ترويسات الأمان مكرّرة هنا عمدًا: أي add_header داخل location
    # يلغي الموروث من مستوى الـ server في nginx.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        # الـ ERP بس هو اللي مسموح يعرض الموقع جوه إطار (زرار المعاينة).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://erp1.dpono.com" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # تطبيق صفحة واحدة — أي مسار يرجّع index.html، بما فيها روابط
    # المقالات القديمة زي /درجات-طحن-البن
    location / {
        try_files $uri $uri/ /index.html;
    }
}
